services:
  backend:
    build:
      context: ./backend
    container_name: call-ai-backend
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      BASE_URL: ${BASE_URL}
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      - ./backend/temp_recordings:/app/temp_recordings
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: call-ai-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped